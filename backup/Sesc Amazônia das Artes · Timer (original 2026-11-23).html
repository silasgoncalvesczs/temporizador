<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sesc Amazônia das Artes · Timer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;700&family=Outfit:wght@300;400;600&display=swap">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#e5e7eb;--pri:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--scr:#0b0f19;--scrtx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155;--pri:#3b82f6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155;--pri:#3b82f6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--card);padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--pri)}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button.d{color:var(--bad)}
input{border:1px solid var(--bd);background:var(--bg);padding:8px 10px;border-radius:8px;min-width:0}
.screen{background:var(--scr);color:var(--scrtx);border-radius:14px;padding:22px 16px;text-align:center;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:230px}
.screen .nm{font-size:clamp(1rem,3vw,1.6rem);opacity:.8}
.screen .tm{font-size:clamp(3.5rem,16vw,9rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.screen .msg{font-size:clamp(1rem,3vw,2rem);background:#fbbf24;color:#111;border-radius:10px;padding:8px 14px;margin:6px auto 0;max-width:90%;font-weight:600}
.screen .bar{position:absolute;left:0;bottom:0;height:8px;background:var(--ok);width:100%;transition:width .3s linear}
.screen.warn .tm{color:#fbbf24}.screen.warn .bar{background:var(--warn)}
.screen.over .tm{color:#f87171}.screen.over .bar{background:var(--bad)}
.screen:fullscreen{border-radius:0;min-height:100vh}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .top input.n{flex:1;min-width:140px}
.card input.m{width:72px}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.3rem;min-width:84px;text-align:right}
.t.over{color:var(--bad)}
.lbl{color:var(--mut);font-size:.85rem}
.viewer .wrap>:not(.screen){display:none}
.viewer .wrap{padding:0;max-width:none}
.viewer .screen{border-radius:0;min-height:100vh}
html:root:not(.a):not(.b){--bg:#ece4d6;--card:#faf6ee;--tx:#14301f;--mut:#5d6a52;--bd:#d8ccb6;--pri:#14301f;--ok:#2e9a3a;--warn:#f5a623;--bad:#a3481f;--scr:#14301f;color-scheme:light}
body{font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-family:"EB Garamond",Georgia,serif;font-size:1.6rem;color:var(--tx)}
h1 .a1{color:#4a6b32}h1 .a2{color:#a3481f}
button.p{background:#14301f;border-color:#14301f;color:#e5d3bb}
button.p:hover{background:#4a6b32;border-color:#4a6b32}
.card.cur{border-color:#a3481f;box-shadow:0 0 0 2px #a3481f inset}
.t.over{color:#a3481f}
.screen{background:radial-gradient(ellipse at 80% 100%,rgba(74,107,50,.95) 0%,rgba(74,107,50,0) 60%),radial-gradient(ellipse at 15% 100%,rgba(46,154,58,.35) 0%,rgba(46,154,58,0) 50%),linear-gradient(180deg,#112a1b 0%,#14301f 55%,#2f4a27 100%);padding:clamp(80px,14vw,150px) 16px clamp(48px,6vw,80px);min-height:360px;gap:10px;isolation:isolate}
.screen>.nm,.screen>.tm,.screen>.msg{position:relative;z-index:2}
.screen .nm{font-family:"EB Garamond",Georgia,serif;font-weight:700;color:#fff;opacity:1;font-size:clamp(1.3rem,4.5vw,3.4rem);letter-spacing:.01em}
.screen .tm{font-family:Outfit,system-ui,sans-serif;font-weight:600;color:#e5d3bb;text-shadow:0 4px 30px rgba(0,0,0,.35);letter-spacing:.02em}
.screen.warn .tm{color:#f5a623}
.screen.over .tm{color:#ff7a5c}
.screen .msg{font-family:Outfit,sans-serif;background:linear-gradient(90deg,#f5a623,#f7c04a);color:#14301f;box-shadow:0 6px 24px rgba(0,0,0,.3);border-left:8px solid #e63946}
.screen .bar{z-index:3;height:10px;background:#2e9a3a}
.screen.warn .bar{background:#f5a623}.screen.over .bar{background:#e63946}
.brand{position:absolute;top:clamp(12px,2.5vw,28px);left:0;right:0;text-align:center;line-height:1;z-index:2;font-family:"EB Garamond",Georgia,serif;font-weight:700;font-size:clamp(1.1rem,3.6vw,2.6rem)}
.brand span{display:block}
.brand .b1{color:#d6c1a8;font-size:.8em}.brand .b2{color:#fff}.brand .b3{color:#d6c1a8}
.brand small{display:block;margin-top:.45em;font-family:Outfit,sans-serif;font-weight:300;font-size:.42em;letter-spacing:.06em;color:#d6c1a8}
.info{position:absolute;bottom:clamp(16px,2.5vw,28px);left:0;right:0;text-align:center;z-index:2;font-family:Outfit,sans-serif;font-weight:300;font-size:clamp(.7rem,1.6vw,1.2rem);color:#e5ded2;padding:0 18%}
.dc{position:absolute;pointer-events:none;z-index:1;width:clamp(90px,19vw,260px)}
.dc.tl{top:-6px;left:-6px}.dc.tr{top:-6px;right:-6px}.dc.bl{bottom:0;left:0}.dc.br{bottom:0;right:0}
.viewer body,body.viewer{background:#14301f}
.screen{min-height:460px;padding-top:clamp(110px,18vw,200px);padding-bottom:clamp(60px,8vw,110px)}
.screen .tm{font-size:clamp(5rem,27vw,17rem);font-weight:700}
.screen .nm{font-size:clamp(1.8rem,7vw,5rem)}
.screen .msg{font-size:clamp(1.4rem,5vw,3.6rem);padding:12px 22px;line-height:1.15}
.brand{font-size:clamp(1.5rem,5vw,3.6rem)}
.brand small{font-size:.5em}
.info{font-size:clamp(.9rem,2.2vw,1.8rem);font-weight:400;padding:0 14%}
.screen .bar{height:14px}
.viewer .screen .tm,.screen:fullscreen .tm{font-size:min(30vw,36vh)}
.viewer .screen .nm,.screen:fullscreen .nm{font-size:min(8vw,9vh)}
.viewer .screen .msg,.screen:fullscreen .msg{font-size:min(6vw,7vh)}
.viewer .brand,.screen:fullscreen .brand{font-size:min(5.5vw,8vh)}
.viewer .info,.screen:fullscreen .info{font-size:min(2.4vw,3.2vh)}
.viewer .screen,.screen:fullscreen{padding-top:min(24vh,22vw);padding-bottom:12vh}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>Sesc <span class="a1">Amazônia</span> <span class="a2">das Artes</span> · Timer</span>
    <span class="row" style="margin:0">
      <button id="bFull">Tela cheia</button>
      <button id="bWin">Abrir tela do palestrante</button>
    </span></h1>

  <div class="screen" id="scr">
<svg class="dc tl" viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(8 8)"><path d="M0 0 L95 70" stroke="#c9a227" stroke-width="2"/><g fill="#2e9a3a"><ellipse cx="22" cy="6" rx="20" ry="6" transform="rotate(25 22 6)"/><ellipse cx="10" cy="26" rx="20" ry="6" transform="rotate(65 10 26)"/><ellipse cx="46" cy="20" rx="22" ry="6" transform="rotate(10 46 20)"/><ellipse cx="34" cy="44" rx="22" ry="6" transform="rotate(50 34 44)"/><ellipse cx="66" cy="40" rx="20" ry="6" transform="rotate(5 66 40)" fill="#4a6b32"/><ellipse cx="58" cy="62" rx="20" ry="6" transform="rotate(45 58 62)" fill="#4a6b32"/></g></g></svg>
<svg class="dc tr" viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="95" cy="28" rx="34" ry="20" transform="rotate(40 95 28)" fill="#7d7a2a"/><ellipse cx="108" cy="62" rx="30" ry="17" transform="rotate(70 108 62)" fill="#a3481f" opacity=".85"/><path d="M118 6 Q80 30 70 52" stroke="#5a2a14" stroke-width="2" fill="none"/></svg>
<svg class="dc bl" viewBox="0 0 200 120" aria-hidden="true"><g fill="#2e9a3a"><ellipse cx="40" cy="100" rx="10" ry="60" transform="rotate(-25 40 100)"/><ellipse cx="62" cy="104" rx="9" ry="62" transform="rotate(-8 62 104)" fill="#4a6b32"/><ellipse cx="88" cy="108" rx="10" ry="56" transform="rotate(12 88 108)"/></g><ellipse cx="140" cy="108" rx="46" ry="30" fill="#1f7a30"/><ellipse cx="170" cy="98" rx="34" ry="24" transform="rotate(-20 170 98)" fill="#2e9a3a"/></svg>
<svg class="dc br" viewBox="0 0 200 120" aria-hidden="true"><ellipse cx="60" cy="108" rx="50" ry="30" fill="#1f7a30"/><ellipse cx="36" cy="98" rx="34" ry="22" transform="rotate(20 36 98)" fill="#2e9a3a"/><g transform="translate(130 100)"><path d="M0 0 L-6 -66" stroke="#e63946" stroke-width="8" stroke-linecap="round"/><path d="M0 0 L24 -52" stroke="#f5a623" stroke-width="11" stroke-linecap="round"/><path d="M0 0 L46 -34" stroke="#f7c04a" stroke-width="10" stroke-linecap="round"/><path d="M0 0 L-30 -50" stroke="#f5a623" stroke-width="10" stroke-linecap="round"/><path d="M0 0 L56 -6" stroke="#f5a623" stroke-width="8" stroke-linecap="round"/></g><g fill="#2e9a3a"><ellipse cx="170" cy="104" rx="10" ry="46" transform="rotate(30 170 104)"/><ellipse cx="186" cy="108" rx="9" ry="40" transform="rotate(50 186 108)" fill="#4a6b32"/></g></svg>
<div class="brand"><span class="b1">Sesc</span><span class="b2">Amazônia</span><span class="b3">das Artes</span><small>Entre amazônias</small></div>
<div class="nm" id="sNm"></div><div class="tm" id="sTm">00:00</div><div class="msg" id="sMsg" hidden></div><div class="info">SESC Acre</div><div class="bar" id="sBar"></div></div>

  <div class="row">
    <input id="msgIn" placeholder="Mensagem para o palestrante" style="flex:1;min-width:200px">
    <button id="bSend" class="p">Enviar</button>
    <button id="bClr">Limpar</button>
  </div>

  <div class="row" style="justify-content:space-between">
    <strong>Programação</strong>
    <span class="row" style="margin:0">
      <button id="bPrev">⏮ Anterior</button>
      <button id="bNext">Próximo ⏭</button>
    </span>
  </div>

  <div id="list"></div>

  <div class="card">
    <div class="lbl" style="margin-bottom:6px">Novo timer</div>
    <div class="row" style="margin:0">
      <input id="nName" placeholder="Nome (ex.: Abertura)" style="flex:1;min-width:160px">
      <input id="nMin" class="m" type="number" min="0" value="10" style="width:80px"> <span class="lbl">min</span>
      <input id="nSec" class="m" type="number" min="0" max="59" value="0" style="width:80px"> <span class="lbl">seg</span>
      <button id="bAdd" class="p">Adicionar</button>
    </div>
  </div>
  <p class="lbl">Dica: espaço inicia/pausa o timer atual. A janela do palestrante acompanha este painel em tempo real (mesmo navegador).</p>
</div>

<script>
(function(){
var KEY='eventtimer.v1';
var S={timers:[],cur:null,msg:''};
var $=function(i){return document.getElementById(i)};
var isViewer=location.hash==='#viewer';
if(isViewer)document.body.classList.add('viewer');

function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.timers)S=o;return true}}catch(e){}return false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return 't'+Math.random().toString(36).slice(2,9)}
if(!load()){
  S.timers=[{id:uid(),name:'Abertura',dur:300,left:300,running:false,endAt:0},
            {id:uid(),name:'Palestra principal',dur:1200,left:1200,running:false,endAt:0},
            {id:uid(),name:'Perguntas e respostas',dur:600,left:600,running:false,endAt:0}];
  S.cur=S.timers[0].id;
}
function get(id){return S.timers.filter(function(t){return t.id===id})[0]}
function rem(t){return t.running?(t.endAt-Date.now())/1000:t.left}
function fmt(s){var n=s<0,v=n?Math.ceil(-s):Math.ceil(s),h=Math.floor(v/3600),m=Math.floor(v%3600/60),x=v%60;
  var p=function(a){return(a<10?'0':'')+a};
  return(n?'−':'')+(h?h+':'+p(m):p(m))+':'+p(x)}
function pause(t){if(t.running){t.left=rem(t);t.running=false}}
function start(id){S.timers.forEach(function(t){if(t.id!==id)pause(t)});var t=get(id);if(!t||t.running)return;S.cur=id;t.endAt=Date.now()+t.left*1000;t.running=true;commit()}
function toggle(id){var t=get(id);if(!t)return;if(t.running){pause(t);commit()}else start(id)}
function reset(id){var t=get(id);t.running=false;t.left=t.dur;commit()}
function adjust(id,d){var t=get(id);if(t.running)t.endAt+=d*1000;else t.left+=d;commit()}
function idx(){return S.timers.map(function(t){return t.id}).indexOf(S.cur)}
function go(d){var i=idx()+d;if(i<0||i>=S.timers.length)return;var wasRun=S.cur&&get(S.cur)&&get(S.cur).running;S.timers.forEach(pause);S.cur=S.timers[i].id;if(wasRun)start(S.cur);else commit()}
function commit(){save();renderList();tick()}

function renderList(){
  if(isViewer)return;
  var L=$('list');L.innerHTML='';
  if(!S.timers.length){L.innerHTML='<div class="card lbl">Nenhum timer. Adicione um abaixo.</div>'}
  S.timers.forEach(function(t,i){
    var d=document.createElement('div');d.className='card'+(t.id===S.cur?' cur':'');
    d.innerHTML='<div class="top"><span class="lbl">'+(i+1)+'</span>'+
    '<input class="n" value="">'+
    '<input class="m" type="number" min="1" title="Duração em minutos"><span class="lbl">min</span>'+
    '<span class="t" data-t="'+t.id+'"></span></div>'+
    '<div class="row" style="margin-bottom:0">'+
    '<button class="p" data-a="tg">'+(t.running?'⏸ Pausar':'▶ Iniciar')+'</button>'+
    '<button data-a="rs">↺ Reiniciar</button>'+
    '<button data-a="m1">−1 min</button><button data-a="p1">+1 min</button>'+
    '<button data-a="sel">Selecionar</button>'+
    '<button data-a="up">↑</button><button data-a="dn">↓</button>'+
    '<button class="d" data-a="del">Excluir</button></div>';
    var n=d.querySelector('.n'),m=d.querySelector('.m');
    n.value=t.name;m.value=Math.round(t.dur/60);
    n.onchange=function(){t.name=n.value;save();tick()};
    m.onchange=function(){var v=Math.max(1,parseInt(m.value)||1);var was=t.left===t.dur;t.dur=v*60;if(!t.running&&was)t.left=t.dur;commit()};
    d.querySelectorAll('button').forEach(function(b){b.onclick=function(){act(t.id,b.dataset.a)}});
    L.appendChild(d);
  });
}
function act(id,a){
  var i=S.timers.map(function(t){return t.id}).indexOf(id);
  if(a==='tg')toggle(id);
  else if(a==='rs')reset(id);
  else if(a==='m1')adjust(id,-60);
  else if(a==='p1')adjust(id,60);
  else if(a==='sel'){S.timers.forEach(pause);S.cur=id;commit()}
  else if(a==='up'&&i>0){var x=S.timers.splice(i,1)[0];S.timers.splice(i-1,0,x);commit()}
  else if(a==='dn'&&i<S.timers.length-1){var y=S.timers.splice(i,1)[0];S.timers.splice(i+1,0,y);commit()}
  else if(a==='del'){S.timers.splice(i,1);if(S.cur===id)S.cur=S.timers[0]?S.timers[0].id:null;commit()}
}

function tick(){
  var t=get(S.cur),scr=$('scr');
  if(t){
    var s=rem(t);
    $('sNm').textContent=t.name;$('sTm').textContent=fmt(s);
    var pct=Math.max(0,Math.min(1,s/t.dur));$('sBar').style.width=(pct*100)+'%';
    scr.className='screen'+(s<=0?' over':(s<=60||pct<=.2?' warn':''));
  }else{$('sNm').textContent='';$('sTm').textContent='--:--';$('sBar').style.width='0';scr.className='screen'}
  var mg=$('sMsg');mg.hidden=!S.msg;mg.textContent=S.msg||'';
  if(!isViewer){
    S.timers.forEach(function(x){var e=document.querySelector('[data-t="'+x.id+'"]');if(e){var v=rem(x);e.textContent=fmt(v);e.className='t'+(v<0?' over':'')}});
  }
}

if(!isViewer){
  $('bAdd').onclick=function(){
    var n=$('nName').value.trim()||'Novo timer';
    var d=(parseInt($('nMin').value)||0)*60+(parseInt($('nSec').value)||0);
    if(d<=0)d=60;
    var t={id:uid(),name:n,dur:d,left:d,running:false,endAt:0};
    S.timers.push(t);if(!S.cur)S.cur=t.id;$('nName').value='';commit();
  };
  $('nName').onkeydown=function(e){if(e.key==='Enter')$('bAdd').click()};
  $('bSend').onclick=function(){S.msg=$('msgIn').value.trim();save();tick()};
  $('msgIn').onkeydown=function(e){if(e.key==='Enter')$('bSend').click()};
  $('bClr').onclick=function(){S.msg='';$('msgIn').value='';save();tick()};
  $('bNext').onclick=function(){go(1)};
  $('bPrev').onclick=function(){go(-1)};
  $('bFull').onclick=function(){var s=$('scr');if(s.requestFullscreen)s.requestFullscreen().catch(function(){})};
  $('bWin').onclick=function(){window.open(location.href.split('#')[0]+'#viewer','etviewer','width=1000,height=600')};
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'&&e.target.tagName!=='INPUT'&&S.cur){e.preventDefault();toggle(S.cur)}
  });
}else{
  $('scr').onclick=function(){if(document.fullscreenElement)document.exitFullscreen();else if($('scr').requestFullscreen)$('scr').requestFullscreen().catch(function(){})};
}
window.addEventListener('storage',function(e){if(e.key===KEY&&load()){renderList();tick()}});
window.addEventListener('hashchange',function(){location.reload()});

renderList();tick();
setInterval(tick,200);
})();
</script>
</body>
</html>
